<!-- VIEW: the shared page frame. Presentation only. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Library{% endblock %} &middot; City College Library</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header>
    <div class="brand">City College <span>Library</span></div>
    <nav>
      <a href="{{ url_for('dashboard.index') }}" class="{{ 'active' if active == 'home' }}">Dashboard</a>
      <a href="{{ url_for('books.index') }}"     class="{{ 'active' if active == 'books' }}">Books</a>
      <a href="{{ url_for('members.index') }}"   class="{{ 'active' if active == 'members' }}">Members</a>
      <a href="{{ url_for('loans.index') }}"     class="{{ 'active' if active == 'loans' }}">Issue / Return</a>
    </nav>
  </header>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
